<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">RAG 知识问答 Agent 示意图</title><desc id="desc">通过合成的问答和引用卡片展示知识检索与依据提示。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e8eff0"/><stop offset="1" stop-color="#f7f2e8"/></linearGradient><filter id="s" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#252a28" flood-opacity=".12"/></filter></defs>
  <rect width="1440" height="900" rx="34" fill="url(#bg)"/><rect x="32" y="32" width="1376" height="836" rx="25" fill="#fdfcf8" stroke="#d9e0dd"/><rect x="32" y="32" width="1376" height="78" rx="25" fill="#263331"/><path d="M32 84h1376v26H32z" fill="#263331"/><circle cx="70" cy="71" r="9" fill="#bcf01b"/><text x="94" y="77" fill="#f4f2e8" font-size="20" font-family="Arial,sans-serif" font-weight="700" letter-spacing="2">KNOWLEDGE / ANSWER WITH SOURCES</text><rect x="1200" y="52" width="165" height="36" rx="18" fill="#3b4a46"/><text x="1223" y="75" fill="#d6ec83" font-size="13" font-family="Arial,sans-serif" letter-spacing="1">SYNTHETIC DEMO</text>
  <text x="106" y="185" fill="#6f7e79" font-size="14" font-family="Arial,sans-serif" letter-spacing="3">RETRIEVAL AUGMENTED GENERATION</text><text x="106" y="234" fill="#27312e" font-size="35" font-family="Arial,sans-serif" font-weight="700">让回答带着依据来</text><text x="106" y="270" fill="#6c7771" font-size="17" font-family="Arial,sans-serif">检索到相关知识，再组织可追溯的答复。</text>
  <rect x="106" y="321" width="1228" height="105" rx="20" fill="#fff" stroke="#e3e7e1" filter="url(#s)"/><circle cx="150" cy="373" r="18" fill="#eef1e9"/><circle cx="147" cy="370" r="8" fill="none" stroke="#6a7d70" stroke-width="2.5"/><path d="m153 376 7 7" stroke="#6a7d70" stroke-width="2.5" stroke-linecap="round"/><text x="190" y="362" fill="#8a928b" font-size="12" font-family="Arial,sans-serif" letter-spacing="1">QUESTION · EXAMPLE</text><text x="190" y="393" fill="#303a35" font-size="18" font-family="Arial,sans-serif">如何让一个知识问答助手回答时说明依据？</text>
  <rect x="106" y="466" width="750" height="304" rx="20" fill="#fff" stroke="#e3e7e1" filter="url(#s)"/><text x="144" y="513" fill="#8a928b" font-size="12" font-family="Arial,sans-serif" letter-spacing="2">GENERATED ANSWER</text><rect x="144" y="536" width="82" height="27" rx="13" fill="#edf4dc"/><text x="162" y="555" fill="#55700f" font-size="12" font-family="Arial,sans-serif" font-weight="700">有依据</text><text x="144" y="603" fill="#303a35" font-size="17" font-family="Arial,sans-serif">先从整理后的资料中检索相关片段，</text><text x="144" y="635" fill="#303a35" font-size="17" font-family="Arial,sans-serif">再基于命中的内容组织回答，并显示引用来源。</text><text x="144" y="667" fill="#68746c" font-size="15" font-family="Arial,sans-serif">如果资料里没有答案，应清楚说明缺口，而不是猜测。</text><rect x="144" y="707" width="670" height="1" fill="#edf0e9"/><text x="144" y="741" fill="#8a928b" font-size="12" font-family="Arial,sans-serif">示例回答 · 不含内部知识或真实问答记录</text>
  <rect x="884" y="466" width="450" height="304" rx="20" fill="#273330" filter="url(#s)"/><text x="921" y="513" fill="#c5ee53" font-size="12" font-family="Arial,sans-serif" letter-spacing="2">RETRIEVED SOURCES</text><text x="921" y="554" fill="#f4f2e7" font-size="20" font-family="Arial,sans-serif" font-weight="700">相关依据</text><rect x="921" y="577" width="374" height="82" rx="14" fill="#34413c"/><circle cx="945" cy="602" r="5" fill="#c5ee53"/><text x="963" y="607" fill="#f2f0e6" font-size="14" font-family="Arial,sans-serif">示例资料 A</text><text x="943" y="635" fill="#b0b8ad" font-size="12" font-family="Arial,sans-serif">合成来源 · 仅作界面示意</text><rect x="921" y="676" width="374" height="1" fill="#48534d"/><text x="921" y="711" fill="#c0c7bb" font-size="13" font-family="Arial,sans-serif">召回 · 引用 · 缺口提示</text><text x="106" y="832" fill="#87918a" font-size="12" font-family="Arial,sans-serif" letter-spacing="1">ALL QUESTIONS, ANSWERS AND SOURCES SHOWN ARE SYNTHETIC</text>
</svg>
