<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Firefly AI 对话应用示意图</title><desc id="desc">以合成文本展示一个独立 AI 对话产品的会话与流式回复界面。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#222924"/><stop offset="1" stop-color="#37413a"/></linearGradient><radialGradient id="glow"><stop stop-color="#bff22a" stop-opacity=".19"/><stop offset="1" stop-color="#bff22a" stop-opacity="0"/></radialGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#080b08" flood-opacity=".3"/></filter></defs>
  <rect width="1440" height="900" rx="34" fill="url(#bg)"/><circle cx="1210" cy="155" r="380" fill="url(#glow)"/><rect x="32" y="32" width="1376" height="836" rx="25" fill="#242b26" stroke="#4b574c"/><rect x="32" y="32" width="314" height="836" rx="25" fill="#1e2520"/><path d="M321 32h25v836h-25z" fill="#1e2520"/><circle cx="79" cy="83" r="14" fill="#bcf01b"/><text x="108" y="90" fill="#f5f2e8" font-size="21" font-family="Arial,sans-serif" font-weight="700">Firefly</text><text x="67" y="157" fill="#8c998d" font-size="12" font-family="Arial,sans-serif" letter-spacing="2">RECENT CHATS</text><rect x="57" y="178" width="265" height="52" rx="13" fill="#303a31"/><circle cx="82" cy="204" r="7" fill="#bff22a"/><text x="103" y="209" fill="#f2f0e6" font-size="14" font-family="Arial,sans-serif">一个新的想法</text><text x="67" y="275" fill="#7d887e" font-size="13" font-family="Arial,sans-serif">对话仅用于独立演示</text>
  <text x="402" y="102" fill="#b7c5af" font-size="13" font-family="Arial,sans-serif" letter-spacing="2">AI COMPANION · DEMO</text><rect x="1212" y="68" width="153" height="38" rx="19" fill="#354037"/><circle cx="1235" cy="87" r="5" fill="#bcf01b"/><text x="1250" y="92" fill="#dce2d4" font-size="12" font-family="Arial,sans-serif">流式对话示意</text>
  <rect x="410" y="160" width="764" height="84" rx="18" fill="#313a32" stroke="#48554a" filter="url(#s)"/><text x="443" y="194" fill="#f2f1e8" font-size="16" font-family="Arial,sans-serif">今天我有个新点子，想先把它慢慢说清楚。</text><text x="443" y="220" fill="#8e9a8e" font-size="12" font-family="Arial,sans-serif">合成示例输入</text>
  <circle cx="437" cy="302" r="17" fill="#bcf01b"/><path d="M431 302h12M437 296v12" stroke="#25301d" stroke-width="2" stroke-linecap="round"/><text x="472" y="307" fill="#d4e6a0" font-size="13" font-family="Arial,sans-serif" letter-spacing="1">FIREFLY</text><text x="411" y="358" fill="#f5f4ea" font-size="18" font-family="Arial,sans-serif">好呀，我们可以先从最吸引你的那部分开始。</text><text x="411" y="393" fill="#c4cbbd" font-size="17" font-family="Arial,sans-serif">你希望它解决什么问题？</text><rect x="411" y="431" width="8" height="8" rx="4" fill="#bcf01b"/><text x="440" y="439" fill="#839186" font-size="13" font-family="Arial,sans-serif">生成内容由模型提供，仅作个人项目演示</text>
  <rect x="410" y="714" width="955" height="82" rx="23" fill="#303831" stroke="#55614f"/><text x="447" y="762" fill="#849186" font-size="15" font-family="Arial,sans-serif">写下你的想法…</text><circle cx="1317" cy="755" r="25" fill="#bcf01b"/><path d="m1308 756 17-8-6 17-3-7-8-2z" fill="#26301c"/>
  <text x="411" y="840" fill="#839186" font-size="12" font-family="Arial,sans-serif" letter-spacing="1">ALL TEXT SHOWN IS SYNTHETIC · NO REAL USER CONVERSATIONS</text>
</svg>
