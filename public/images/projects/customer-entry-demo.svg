<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">AI 客户信息录入助手示意界面</title>
  <desc id="desc">用合成对话演示 AI 提取客户需求并等待人工复核的表单工作流。</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f9f7ef"/><stop offset="1" stop-color="#eee9dc"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#c8f236"/><stop offset="1" stop-color="#93c51a"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#25251f" flood-opacity=".1"/></filter>
  </defs>
  <rect width="1440" height="900" rx="34" fill="url(#bg)"/><rect x="32" y="32" width="1376" height="836" rx="25" fill="#fffdf8" stroke="#ded9cc"/>
  <rect x="32" y="32" width="1376" height="76" rx="25" fill="#24261f"/><path d="M32 83h1376v25H32z" fill="#24261f"/><circle cx="70" cy="70" r="9" fill="#c3ec36"/><text x="93" y="76" fill="#f7f5ec" font-size="20" font-family="Arial,sans-serif" font-weight="700" letter-spacing="2">FIELDNOTE / INTAKE FLOW</text><rect x="1207" y="52" width="160" height="36" rx="18" fill="#393b32"/><circle cx="1230" cy="70" r="5" fill="#c3ec36"/><text x="1244" y="75" fill="#e9e7dc" font-size="13" font-family="Arial,sans-serif" letter-spacing="1">SYNTHETIC DEMO</text>
  <text x="94" y="166" fill="#77756b" font-size="14" font-family="Arial,sans-serif" letter-spacing="3">AI-ASSISTED CUSTOMER INTAKE</text><text x="94" y="212" fill="#25261f" font-size="34" font-family="Arial,sans-serif" font-weight="700">客户信息结构化录入</text><text x="94" y="247" fill="#77756b" font-size="17" font-family="Arial,sans-serif">把零散对话整理成可检查的字段，确认后再进入业务系统。</text>
  <rect x="94" y="286" width="540" height="514" rx="22" fill="#fff" stroke="#e4e0d6" filter="url(#shadow)"/><text x="128" y="330" fill="#77756b" font-size="13" font-family="Arial,sans-serif" letter-spacing="2">SOURCE MESSAGE · EXAMPLE</text>
  <rect x="128" y="358" width="466" height="101" rx="16" fill="#f1efe8"/><circle cx="156" cy="389" r="14" fill="#dedacd"/><text x="151" y="394" fill="#676457" font-size="11" font-family="Arial,sans-serif" font-weight="700">示</text><text x="183" y="390" fill="#36372f" font-size="16" font-family="Arial,sans-serif">想做一批礼盒，尺寸和数量后面再确认。</text><text x="183" y="421" fill="#858276" font-size="12" font-family="Arial,sans-serif">合成示例文本，不含真实客户内容</text>
  <rect x="128" y="491" width="466" height="1" fill="#ece9e0"/><text x="128" y="532" fill="#77756b" font-size="13" font-family="Arial,sans-serif" letter-spacing="2">PROCESS</text>
  <circle cx="146" cy="577" r="14" fill="url(#accent)"/><text x="142" y="582" fill="#30351f" font-size="12" font-family="Arial,sans-serif" font-weight="700">1</text><text x="174" y="582" fill="#33342c" font-size="15" font-family="Arial,sans-serif" font-weight="700">识别需求字段</text><text x="174" y="606" fill="#858276" font-size="13" font-family="Arial,sans-serif">从自然语言提取可确认的信息</text>
  <circle cx="146" cy="653" r="14" fill="#e9e6dc"/><text x="142" y="658" fill="#6f6c61" font-size="12" font-family="Arial,sans-serif" font-weight="700">2</text><text x="174" y="658" fill="#33342c" font-size="15" font-family="Arial,sans-serif" font-weight="700">人工检查与补全</text><text x="174" y="682" fill="#858276" font-size="13" font-family="Arial,sans-serif">未提供的信息保留为空，不猜测</text>
  <circle cx="146" cy="729" r="14" fill="#e9e6dc"/><text x="142" y="734" fill="#6f6c61" font-size="12" font-family="Arial,sans-serif" font-weight="700">3</text><text x="174" y="734" fill="#33342c" font-size="15" font-family="Arial,sans-serif" font-weight="700">确认后填入表单</text><text x="174" y="758" fill="#858276" font-size="13" font-family="Arial,sans-serif">由业务员决定是否提交</text>
  <path d="M655 542h58" stroke="#b7b2a5" stroke-width="2" stroke-dasharray="5 7"/><path d="m705 534 10 8-10 8" fill="none" stroke="#8a877b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="734" y="286" width="612" height="514" rx="22" fill="#fff" stroke="#e4e0d6" filter="url(#shadow)"/><text x="772" y="330" fill="#77756b" font-size="13" font-family="Arial,sans-serif" letter-spacing="2">EXTRACTED FIELDS</text><text x="772" y="367" fill="#282920" font-size="22" font-family="Arial,sans-serif" font-weight="700">需求草稿</text><rect x="1165" y="343" width="143" height="33" rx="16" fill="#f3efd9"/><circle cx="1183" cy="359" r="5" fill="#d19628"/><text x="1196" y="364" fill="#73603b" font-size="12" font-family="Arial,sans-serif">待人工复核</text>
  <text x="772" y="420" fill="#77756b" font-size="13" font-family="Arial,sans-serif">产品类型</text><rect x="772" y="435" width="536" height="52" rx="12" fill="#fbfaf6" stroke="#e8e4d9"/><text x="790" y="467" fill="#33342c" font-size="15" font-family="Arial,sans-serif">礼盒（示例）</text>
  <text x="772" y="524" fill="#77756b" font-size="13" font-family="Arial,sans-serif">规格尺寸</text><rect x="772" y="539" width="253" height="52" rx="12" fill="#fbfaf6" stroke="#e8e4d9"/><text x="790" y="571" fill="#969387" font-size="15" font-family="Arial,sans-serif">待确认</text><text x="1055" y="524" fill="#77756b" font-size="13" font-family="Arial,sans-serif">预估数量</text><rect x="1055" y="539" width="253" height="52" rx="12" fill="#fbfaf6" stroke="#e8e4d9"/><text x="1073" y="571" fill="#969387" font-size="15" font-family="Arial,sans-serif">未提供</text>
  <text x="772" y="629" fill="#77756b" font-size="13" font-family="Arial,sans-serif">补充说明</text><rect x="772" y="644" width="536" height="58" rx="12" fill="#fbfaf6" stroke="#e8e4d9"/><text x="790" y="679" fill="#77756b" font-size="14" font-family="Arial,sans-serif">字段来源清楚 · 缺失项等待人工补充</text>
  <rect x="772" y="724" width="536" height="48" rx="24" fill="url(#accent)"/><text x="917" y="754" fill="#29311b" font-size="15" font-family="Arial,sans-serif" font-weight="700">确认信息后继续</text>
  <text x="94" y="838" fill="#908d80" font-size="12" font-family="Arial,sans-serif" letter-spacing="1">ALL NAMES, MESSAGES AND FIELDS SHOWN ARE SYNTHETIC</text>
</svg>
